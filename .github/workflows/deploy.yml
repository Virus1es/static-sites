name: Build and Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Restore analysis cache
        id: analysis-cache
        uses: actions/cache@v6
        with:
          path: | 
            .cache
            generated
            images/generated
            files/plots
          key: ${{ runner.os }}-analysis-python3.12-${{ hashFiles('data/experiment_results.csv', 'scripts/*.py', 'requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-analysis-python3.12-

      - name: Install deps
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nox
      
      - name: Configurate GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env: 
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m nox -s build
      
      - name: Valid generated site
        run: |
          test -f output/index.html
          test -f output/results/index.html
          test -f output/plots/hit_rate.html
          test -f output/plots/latency.html
      
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-output
          path: output/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
  
  deploy-ghpages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  
  deploy-helios:
    name: Deploy to Helios
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site-output
          path: output
      
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 2222 helios.cs.ifmo.ru >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      
      - name: Deploy site to Helios
        env:
          HELIOS_LOGIN: ${{ secrets.HELIOS_LOGIN }}
          SSHPASS: ${{ secrets.HELIOS_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p 2222 \
            "$HELIOS_LOGIN@helios.cs.ifmo.ru" \
            'rm -rf ~/public_html/.static-site-next && mkdir -p ~/public_html/.static-site-next'
          
          sshpass -e scp \
            -O \
            -r \
            -P 2222 \
            output/. \
            "$HELIOS_LOGIN@helios.cs.ifmo.ru:~/public_html/.static-site-next/"
          
          sshpass -e ssh \
            -p 2222 \
             "$HELIOS_LOGIN@helios.cs.ifmo.ru" \
             'rm -rf ~/public_html/static-site && mv ~/public_html/.static-site-next/ ~/public_html/static-site'